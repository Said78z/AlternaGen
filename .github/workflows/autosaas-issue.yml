name: AutoSaaS Daily Issue

on:
  schedule:
    # Runs every day at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  create-issue:
    name: Create AutoSaaS MVP Issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Create issue
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_autosaas_issue.py
