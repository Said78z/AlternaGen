name: Daily SaaS Factory Pipeline

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Signal sources (space-separated)"
        required: false
        default: "hackernews rss_techcrunch"
      max_signals:
        description: "Max signals to collect"
        required: false
        default: "30"
      min_score:
        description: "Minimum HN score"
        required: false
        default: "50"
      top_n:
        description: "Number of top ideas to rank"
        required: false
        default: "5"

# Limit to 1 concurrent pipeline run to prevent duplicate MVPs
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  MAX_MVPS_PER_DAY: "1"

jobs:
  pipeline:
    name: SignalScout → IdeaRanker → SpecWriter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run SignalScout
        run: |
          mkdir -p out
          python -m bots.signal_scout.main \
            --sources ${{ github.event.inputs.sources || 'hackernews rss_techcrunch' }} \
            --max-signals ${{ github.event.inputs.max_signals || '30' }} \
            --min-score ${{ github.event.inputs.min_score || '50' }} \
            --out out/signal_scout_output.json

      - name: Run IdeaRanker
        run: |
          python -m bots.idea_ranker.main \
            --in out/signal_scout_output.json \
            --top-n ${{ github.event.inputs.top_n || '5' }} \
            --out out/idea_ranker_output.json

      - name: Run SpecWriter
        run: |
          python -m bots.spec_writer.main \
            --in out/idea_ranker_output.json \
            --out out/spec_writer_output.json

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: out/
          retention-days: 7

      - name: Create MVP Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, subprocess, sys, textwrap
          from pathlib import Path

          data = json.loads(Path("out/spec_writer_output.json").read_text())
          spec = data["spec"]

          # Build features list (P0 only for issue)
          p0_features = [
              f"- **{f['name']}**: {f['description']}"
              for f in spec.get("core_features", [])
              if f.get("priority") == "P0"
          ]

          # Build milestones summary
          milestones = "\n".join(
              f"- **{m['name']}** ({m['duration']})"
              for m in spec.get("milestones", [])
          )

          target_users = "\n".join(f"- {u}" for u in spec.get("target_users", []))

          body = textwrap.dedent(f"""\
          ## 📋 Spec ID
          `{spec['id']}`

          ## 🎯 Problem
          {spec['problem']}

          ## 💡 Solution
          {spec['solution']}

          ## 👥 Target Users
          {target_users}

          ## ✨ Core Features (P0)
          {chr(10).join(p0_features)}

          ## 🛠 Tech Stack
          - **Frontend**: {spec['tech_stack'].get('frontend', 'TBD')}
          - **Backend**: {spec['tech_stack'].get('backend', 'TBD')}
          - **Database**: {spec['tech_stack'].get('database', 'TBD')}
          - **Infra**: {spec['tech_stack'].get('infra', 'TBD')}

          ## 📅 Timeline
          {milestones}

          ## 🔗 Signal Source
          {spec.get('signal_source_url', 'N/A')}

          ---

          **Next steps:**
          - [ ] Review and approve this spec
          - [ ] Trigger `build` workflow (or add label `mvp-approved`) to bootstrap the repository
          - [ ] Assign to a developer

          > *Auto-generated by [AlternaGen SaaS Factory](https://github.com/${{ github.repository }})*
          """)

          title = f"[MVP] {spec['title'][:100]}"
          result = subprocess.run(
              ["gh", "issue", "create",
               "--title", title,
               "--body", body,
               "--label", "mvp-idea,auto-generated"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              # Labels may not exist yet – retry without labels
              result = subprocess.run(
                  ["gh", "issue", "create",
                   "--title", title,
                   "--body", body],
                  capture_output=True, text=True
              )
          if result.returncode == 0:
              print("✅ Issue created:", result.stdout.strip())
          else:
              print("❌ Failed to create issue:", result.stderr, file=sys.stderr)
              sys.exit(1)
          EOF
