name: SaaS Factory — Daily Pipeline

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated signal sources (hackernews,rss)'
        required: false
        default: 'hackernews,rss'
      limit:
        description: 'Max signals per source'
        required: false
        default: '20'

jobs:
  run-pipeline:
    name: Run SignalScout → IdeaRanker → SpecWriter
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run early pipeline (SignalScout + IdeaRanker + SpecWriter)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DAILY_MVP_LIMIT: '1'
        run: |
          python -m bots.pipeline \
            --phase early \
            --sources "${{ github.event.inputs.sources || 'hackernews,rss' }}" \
            --limit "${{ github.event.inputs.limit || '20' }}" \
            --out-dir out/ \
            --skip-limit-check

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs-${{ github.run_id }}
          path: out/
          retention-days: 7

      - name: Create MVP issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, subprocess
          from pathlib import Path
          from datetime import datetime, timezone

          spec_file = Path("out/spec_writer.json")
          idea_file = Path("out/idea_ranker.json")

          if not spec_file.exists():
              print("No spec file found — pipeline may have produced no results.")
              exit(0)

          spec_data = json.loads(spec_file.read_text())
          idea_data = json.loads(idea_file.read_text()) if idea_file.exists() else {}

          spec = spec_data.get("spec", {})
          source_idea = spec_data.get("source_idea", {})
          timestamp = spec_data.get("timestamp", datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))

          title = f"[MVP] {spec.get('title', 'New MVP Idea')} — {timestamp[:10]}"
          
          features_md = "\n".join(
              f"- **[{f['priority']}]** `{f['name']}` — {f['description']}"
              for f in spec.get("features", [])
          )
          stack_joined = ", ".join(f"`{s}`" for s in spec.get("tech_stack", []))
          metrics_md = "\n".join(f"- {m}" for m in spec.get("success_metrics", []))
          spec_json = json.dumps(spec, indent=2)

          body = f"""## 🤖 MVP Idea of the Day

          > Auto-generated by **SaaS Factory** daily pipeline · `{timestamp}`

          ### {spec.get('title', '')}

          {spec.get('description', '')}

          **Problem:** {spec.get('problem_statement', '')}

          **Target audience:** {spec.get('target_audience', '')}

          **Monetization:** {spec.get('monetization', '')}

          ### ✨ Core Features

          {features_md}

          ### 🛠️ Tech Stack

          {stack_joined}

          ### 🎯 MVP Scope

          {spec.get('mvp_scope', '')}

          ### 📊 Success Metrics

          {metrics_md}

          ---

          **Score:** {source_idea.get('score', 'N/A')} / 100 · **Complexity:** {source_idea.get('complexity', 'N/A')} · **Market size:** {source_idea.get('market_size', 'N/A')}

          <details>
          <summary>📁 Full spec JSON</summary>

          ```json
          {spec_json}
          ```

          </details>

          ---

          > ⚠️ This issue was created automatically. A human must review and approve before any code is merged.
          > Add the `approved` label to trigger the bootstrap workflow.
          """

          # Write body to a temp file to avoid shell quoting issues
          body_file = Path("/tmp/issue_body.md")
          body_file.write_text(body)

          result = subprocess.run(
              ["gh", "issue", "create",
               "--title", title,
               "--body-file", str(body_file),
               "--label", "mvp"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              # Label may not exist — try without label
              result = subprocess.run(
                  ["gh", "issue", "create",
                   "--title", title,
                   "--body-file", str(body_file)],
                  capture_output=True, text=True
              )
          print(result.stdout)
          if result.returncode != 0:
              print("Error creating issue:", result.stderr, flush=True)
              exit(result.returncode)
          EOF
